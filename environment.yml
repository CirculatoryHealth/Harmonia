name: harmonia
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - bcftools          # bioconda — required by gwaslab VCF sweep steps
  - pip
  - pip:
      - "numpy>=1.21.2,<2"
      - pyliftover
      - tqdm
      - "adjusttext==0.8"
      - "matplotlib>=3.8,<3.9"
      - "pandas>=1.3,!=1.5"
      - "pysam==0.22.1"
      - "scikit-allel>=1.3.5"
      - "scipy>=1.12"
      - "seaborn>=0.12"
      - "h5py>=3.10.0"
      - pyarrow
      - "polars-lts-cpu>=1.27.0"   # CPU-compat build (SSE4/no AVX2); prevents SIGILL on older HPC nodes
      - "sumstats-liftover==1.1.0"
      - "jupyter==1.0.0"
      - gwaslab
